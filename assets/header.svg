<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Willyam Voges · Founder @ eSoluções · Full-Stack Developer">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7F00FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#7F00FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7F00FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 15px; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>

  <rect x="64" y="76" width="56" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="142" class="sans" font-size="56" font-weight="700" fill="#ffffff">Willyam Voges</text>
  <text x="64" y="188" class="sans" font-size="24" font-weight="600" fill="#00D4FF">Founder @ eSoluções · Full-Stack Developer</text>
  <text x="64" y="232" class="sans" font-size="18" fill="#8b949e">Software sob medida para empresas, do front-end ao deploy.</text>
  <text x="64" y="268" class="sans" font-size="15" fill="#6e7681">Porto Alegre, RS  ·  esolu.com.br</text>

  <g transform="translate(772 64)">
    <rect width="364" height="192" rx="12" fill="#161B22" stroke="#30363d"/>
    <circle cx="22" cy="22" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="22" r="5" fill="#febc2e"/>
    <circle cx="58" cy="22" r="5" fill="#28c840"/>
    <text x="22" y="70" class="mono" fill="#c9d1d9"><tspan fill="#ff7b72">const</tspan> <tspan fill="#d2a8ff">eSolucoes</tspan> = {</text>
    <text x="22" y="98" class="mono" fill="#c9d1d9">  foco: <tspan fill="#a5d6ff">"problemas reais"</tspan>,</text>
    <text x="22" y="126" class="mono" fill="#c9d1d9">  entrega: <tspan fill="#a5d6ff">"sob medida"</tspan>,</text>
    <text x="22" y="154" class="mono" fill="#c9d1d9">  automatiza: <tspan fill="#79c0ff">true</tspan>,</text>
    <text x="22" y="178" class="mono" fill="#c9d1d9">};</text>
  </g>
