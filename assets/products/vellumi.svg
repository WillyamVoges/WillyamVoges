<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="Vellumi: Gestão completa para salões: agenda, fichas de clientes, caixa e comissões, com uma atendente de IA que agenda pelo WhatsApp.">
<defs><linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#7F00FF"/><stop offset="1" stop-color="#00D4FF"/></linearGradient></defs>
<style>
.g{font:600 11px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#00D4FF;letter-spacing:1.2px}
.n{font:700 22px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#ffffff}
.d{font:400 14px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#8b949e}
.c{font:500 12px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#c9d1d9}
.s{font:500 12px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#3fb950}
</style>
<rect x="0.5" y="0.5" width="439" height="219" rx="12" fill="#0D1117" stroke="#30363d"/>
<rect x="24" y="24" width="32" height="3" rx="1.5" fill="url(#accent)"/>
<circle cx="320" cy="44" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle><text x="416" y="49" class="s" text-anchor="end">Em evolução</text>
<text x="24" y="52" class="g">BELEZA · IA</text>
<text x="24" y="82" class="n">Vellumi</text>
<text x="24" y="112" class="d">Gestão completa para salões: agenda, fichas de</text>
<text x="24" y="132" class="d">clientes, caixa e comissões, com uma atendente de IA</text>
<text x="24" y="152" class="d">que agenda pelo WhatsApp.</text>
<rect x="24" y="170" width="96" height="26" rx="13" fill="#161B22" stroke="#30363d"/><text x="72" y="188" class="c" text-anchor="middle">TypeScript</text>
<rect x="128" y="170" width="96" height="26" rx="13" fill="#161B22" stroke="#30363d"/><text x="176" y="188" class="c" text-anchor="middle">JavaScript</text>
<rect x="232" y="170" width="66" height="26" rx="13" fill="#161B22" stroke="#30363d"/><text x="265" y="188" class="c" text-anchor="middle">NestJS</text>
<rect x="306" y="170" width="66" height="26" rx="13" fill="#161B22" stroke="#30363d"/><text x="339" y="188" class="c" text-anchor="middle">Prisma</text>
