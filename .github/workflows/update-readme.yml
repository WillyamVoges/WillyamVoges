name: Atualizar README

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06h (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "stacks.config.json"
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Detectar stacks e projetos
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Crie o secret GH_PAT (fine-grained, Contents: read-only em todos os repositórios) para incluir os privados
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza stacks e projetos 🤖"
          git push
