name: Atualizar README

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06h (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stacks.config.json"
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Detectar stacks e projetos
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: crie o secret GH_PAT (token com escopo "repo") para incluir repositórios privados
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "chore: atualiza stacks e projetos 🤖"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D4FF&color_dots=#161b22,#3b1f6e,#5a2ea6,#7F00FF,#00D4FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
